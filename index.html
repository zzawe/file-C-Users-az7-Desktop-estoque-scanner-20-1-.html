<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Estoque Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Estoque">
<script src="lib/zxing.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{--bg:#ffffff;--fg:#111111;--muted:#8a8a8a;--line:#ececec;--soft:#f6f6f6;--in:#1f9d55;--out:#d64545;--accent:#111111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.4;padding-bottom:72px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
header .count{font-size:12px;color:var(--muted);font-weight:500}
main{padding:18px;max-width:640px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.btn.secondary{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--muted);padding:10px}
.btn:active{opacity:.85}
.btn.in{background:var(--in)}
.btn.out{background:var(--out)}
.row{display:flex;gap:10px}
.row>*{flex:1}
input,select{font-family:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--bg);color:var(--fg)}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:var(--bg)}
.scanbox{position:relative;width:100%;aspect-ratio:1/1;max-height:60vh;border-radius:18px;overflow:hidden;background:#000}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;inset:18%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
.scanframe:after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:#fff;opacity:.7;animation:scanline 2s linear infinite}
@keyframes scanline{0%{top:8%}50%{top:92%}100%{top:8%}}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:14px 2px}
.manual{display:flex;gap:10px;margin-top:14px}
.manual input{flex:1}
.manual button{flex:0 0 auto;padding:13px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .meta{flex:1;min-width:0}
.item .meta .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta .s{font-size:12px;color:var(--muted);margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.badge.pos{background:rgba(31,157,85,.12);color:var(--in)}
.badge.neg{background:rgba(214,69,69,.12);color:var(--out)}
.badge.zero{background:var(--soft);color:var(--muted)}
.mv{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mv .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mv .dot.in{background:var(--in)}.mv .dot.out{background:var(--out)}
.mv .meta{flex:1;min-width:0}
.mv .meta .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .meta .s{font-size:11px;color:var(--muted);margin-top:1px}
.mv .q{font-weight:700;font-size:15px}
.mv .q.in{color:var(--in)}.mv .q.out{color:var(--out)}
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px}
.empty .big{font-size:34px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px env(safe-area-inset-right) calc(6px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;color:var(--muted);font-size:11px;font-weight:600}
nav button.active{color:var(--accent)}
nav button svg{width:22px;height:22px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .code{font-size:12px;color:var(--muted);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
.spin.dark{border-color:rgba(0,0,0,.2);border-top-color:#111}
@keyframes rot{to{transform:rotate(360deg)}}
.stock{display:flex;gap:10px;margin-bottom:16px}
.stock .box{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stock .box .n{font-size:22px;font-weight:700}
.stock .box .l{font-size:11px;color:var(--muted);margin-top:2px}
.secmini{font-size:12px;color:var(--muted);font-weight:600;margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.6px}
</style>
</head>
<body>
<header>
  <h1 id="viewTitle">Escanear</h1>
  <span class="count" id="hdrInfo"></span>
</header>
<main>
  <!-- ESCANEAR -->
  <section class="view active" id="view-scan">
    <div class="scanbox"><video id="video" playsinline muted></video><div class="scanframe"></div></div>
    <p class="hint" id="scanHint">Aponte a câmera para o código de barras</p>
    <div class="row">
      <button class="btn secondary" id="btnCam">Ligar câmera</button>
      <button class="btn secondary" id="btnFlip">Virar câmera</button>
    </div>
    <div class="manual">
      <input id="manualCode" inputmode="numeric" placeholder="Digitar código manualmente">
      <button id="btnManual">OK</button>
    </div>
  </section>
  <!-- PRODUTOS -->
  <section class="view" id="view-products">
    <div id="productsList"></div>
  </section>
  <!-- MOVIMENTACOES -->
  <section class="view" id="view-moves">
    <div class="stock">
      <div class="box"><div class="n" id="sumIn">0</div><div class="l">Entrou</div></div>
      <div class="box"><div class="n" id="sumOut">0</div><div class="l">Saiu</div></div>
      <div class="box"><div class="n" id="sumBal">0</div><div class="l">Saldo</div></div>
    </div>
    <button class="btn" id="btnExport">Baixar planilha (Excel)</button>
    <div class="secmini">Histórico</div>
    <div id="movesList"></div>
  </section>
</main>
<nav>
  <button class="active" data-view="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18"/></svg>Escanear</button>
  <button data-view="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>Produtos</button>
  <button data-view="moves"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/></svg>Planilha</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const DB={
  products: JSON.parse(localStorage.getItem('es_products')||'{}'),
  moves: JSON.parse(localStorage.getItem('es_moves')||'[]')
};
function save(){localStorage.setItem('es_products',JSON.stringify(DB.products));localStorage.setItem('es_moves',JSON.stringify(DB.moves));}
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function emptyBox(t,s){return '<div class="empty"><div class="big">\u25a1</div><div style="font-weight:600;color:var(--fg)">'+t+'</div><div style="margin-top:4px">'+s+'</div></div>';}

/* ---- Navegação ---- */
const titles={scan:'Escanear',products:'Produtos',moves:'Planilha'};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function switchView(v){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  $('#view-'+v).classList.add('active');
  $('#viewTitle').textContent=titles[v];
  if(v==='products')renderProducts();
  if(v==='moves')renderMoves();
  if(v!=='scan')stopScanner();
  updateHeader();
}
function updateHeader(){const p=Object.keys(DB.products).length;$('#hdrInfo').textContent=p?p+' produto'+(p>1?'s':''):'';}

/* ---- Scanner ---- */
let codeReader=null,scannerOn=false,devices=[],devIdx=0,lastCode='',lastTime=0;
function ensureReader(){if(!codeReader)codeReader=new ZXing.BrowserMultiFormatReader();return codeReader;}
async function startScanner(){
  try{
    const reader=ensureReader();
    if(!devices.length){
      devices=await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
      const back=devices.findIndex(d=>/back|rear|tras|environment/i.test(d.label));
      devIdx=back>=0?back:(devices.length?devices.length-1:0);
    }
    const devId=devices.length?devices[devIdx].deviceId:undefined;
    await reader.decodeFromVideoDevice(devId,'video',(res)=>{if(res)onScan(res.getText());});
    scannerOn=true;$('#btnCam').textContent='Desligar c\u00e2mera';
    $('#scanHint').textContent='Aponte a c\u00e2mera para o c\u00f3digo de barras';
  }catch(e){$('#scanHint').textContent='N\u00e3o consegui acessar a c\u00e2mera. Abra por HTTPS e permita o acesso \u2014 ou digite o c\u00f3digo abaixo.';scannerOn=false;$('#btnCam').textContent='Ligar c\u00e2mera';}
}
function stopScanner(){if(codeReader){try{codeReader.reset();}catch(e){}}scannerOn=false;if($('#btnCam'))$('#btnCam').textContent='Ligar c\u00e2mera';}
$('#btnCam').onclick=()=>{if(scannerOn)stopScanner();else startScanner();};
$('#btnFlip').onclick=()=>{if(devices.length<2){toast('S\u00f3 h\u00e1 uma c\u00e2mera');return;}devIdx=(devIdx+1)%devices.length;stopScanner();startScanner();};
$('#btnManual').onclick=()=>{const c=$('#manualCode').value.trim();if(c){$('#manualCode').value='';onScan(c);}};
$('#manualCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#btnManual').click();});
function onScan(code){
  code=(code||'').trim();if(!code)return;
  const now=Date.now();
  if(code===lastCode&&now-lastTime<2500)return;
  lastCode=code;lastTime=now;
  if(navigator.vibrate)navigator.vibrate(60);
  openProductFlow(code);
}
function openProductFlow(code){if(DB.products[code])openMovement(code);else openRegister(code,false);}

/* ---- Modal ---- */
function showModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('open');}
function closeModal(){$('#modal').classList.remove('open');}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

/* ---- Movimentação ---- */
function openMovement(code){
  const p=DB.products[code];
  showModal(
    '<h2>'+esc(p.description)+'</h2>'+
    '<div class="code">C\u00f3digo '+code+' \u00b7 '+p.unitsPerBox+' un por caixa/fardo</div>'+
    '<label>Caixas / fardos</label><input id="mBoxes" inputmode="numeric" value="1">'+
    '<label>Unidades avulsas (opcional)</label><input id="mUnits" inputmode="numeric" value="0">'+
    '<p class="hint" id="mCalc"></p>'+
    '<div class="row"><button class="btn in" id="doIn">Entrou</button><button class="btn out" id="doOut">Saiu</button></div>'+
    '<button class="btn ghost" id="mEdit">Editar produto</button>'
  );
  const total=()=>{const b=parseInt($('#mBoxes').value)||0,u=parseInt($('#mUnits').value)||0;return b*p.unitsPerBox+u;};
  const upd=()=>{$('#mCalc').textContent='Total: '+total()+' un';};
  $('#mBoxes').oninput=upd;$('#mUnits').oninput=upd;upd();
  $('#doIn').onclick=()=>commitMove(code,'in',total());
  $('#doOut').onclick=()=>commitMove(code,'out',total());
  $('#mEdit').onclick=()=>openRegister(code,true);
}
function commitMove(code,type,units){
  if(units<=0){toast('Informe a quantidade');return;}
  const p=DB.products[code];
  DB.moves.unshift({id:Date.now(),code:code,description:p.description,type:type,units:units,unitsPerBox:p.unitsPerBox,date:new Date().toISOString()});
  save();closeModal();
  toast((type==='in'?'Entrada':'Sa\u00edda')+' de '+units+' un registrada');
  if($('#view-moves').classList.contains('active'))renderMoves();
  if($('#view-products').classList.contains('active'))renderProducts();
}
/* ---- Cadastro / edição ---- */
function openRegister(code,isEdit){
  const p=DB.products[code]||{};
  showModal(
    '<h2>'+(isEdit?'Editar produto':'Novo produto')+'</h2>'+
    '<div class="code">C\u00f3digo de barras '+code+'</div>'+
    '<label>Descri\u00e7\u00e3o</label><input id="rDesc" placeholder="Nome do produto" value="'+esc(p.description||'')+'">'+
    '<p class="hint" id="rFetch" style="text-align:left;margin:6px 2px"></p>'+
    '<label>Unidades por caixa / fardo</label><input id="rUnits" inputmode="numeric" value="'+(p.unitsPerBox||1)+'">'+
    '<button class="btn" id="rSave" style="margin-top:18px">Salvar</button>'+
    (isEdit?'<button class="btn ghost" id="rDel">Excluir produto</button>':'')
  );
  $('#rSave').onclick=()=>{
    const d=$('#rDesc').value.trim()||('C\u00f3digo '+code);
    const u=parseInt($('#rUnits').value)||1;
    DB.products[code]={barcode:code,description:d,unitsPerBox:u};
    save();updateHeader();
    if(isEdit){closeModal();toast('Produto atualizado');renderProducts();}
    else openMovement(code);
  };
  if(isEdit)$('#rDel').onclick=()=>{if(confirm('Excluir este produto? O hist\u00f3rico de movimenta\u00e7\u00f5es ser\u00e1 mantido.')){delete DB.products[code];save();closeModal();renderProducts();updateHeader();}};
  if(!isEdit&&!p.description)autoFetch(code);
}
async function autoFetch(code){
  const el=$('#rFetch');if(!el)return;
  el.innerHTML='<span class="spin dark"></span> Buscando descri\u00e7\u00e3o na internet...';
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity');
    const j=await r.json();
    if(j&&j.status===1&&j.product){
      const pr=j.product;
      const name=[pr.brands,pr.product_name,pr.quantity].filter(Boolean).join(' ').trim();
      if(name){const i=$('#rDesc');if(i&&!i.value){i.value=name;}el.textContent='Descri\u00e7\u00e3o encontrada \u2014 confira e ajuste se quiser.';return;}
    }
    el.textContent='N\u00e3o encontrei na base p\u00fablica. Digite a descri\u00e7\u00e3o manualmente.';
  }catch(e){el.textContent='Sem internet para a busca. Digite a descri\u00e7\u00e3o manualmente.';}
}
/* ---- Listas ---- */
function stockOf(code){return DB.moves.reduce((s,m)=>s+(m.code===code?(m.type==='in'?m.units:-m.units):0),0);}
function renderProducts(){
  const el=$('#productsList');const keys=Object.keys(DB.products);
  if(!keys.length){el.innerHTML=emptyBox('Nenhum produto ainda','Escaneie um c\u00f3digo de barras para cadastrar o primeiro produto.');return;}
  el.innerHTML='<div class="card">'+keys.map(c=>{
    const p=DB.products[c],st=stockOf(c),cls=st>0?'pos':(st<0?'neg':'zero');
    return '<div class="item" data-c="'+c+'"><div class="meta"><div class="t">'+esc(p.description)+'</div><div class="s">'+c+' \u00b7 '+p.unitsPerBox+' un/caixa</div></div><span class="badge '+cls+'">'+st+' un</span></div>';
  }).join('')+'</div>';
  el.querySelectorAll('.item').forEach(it=>it.onclick=()=>openMovement(it.dataset.c));
}
function renderMoves(){
  let tin=0,tout=0;DB.moves.forEach(m=>{if(m.type==='in')tin+=m.units;else tout+=m.units;});
  $('#sumIn').textContent=tin;$('#sumOut').textContent=tout;$('#sumBal').textContent=tin-tout;
  const el=$('#movesList');
  if(!DB.moves.length){el.innerHTML=emptyBox('Sem movimenta\u00e7\u00f5es','Entradas e sa\u00eddas aparecer\u00e3o aqui.');return;}
  el.innerHTML='<div class="card">'+DB.moves.map(m=>{
    const d=new Date(m.date),ds=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return '<div class="mv"><span class="dot '+m.type+'"></span><div class="meta"><div class="t">'+esc(m.description)+'</div><div class="s">'+ds+' \u00b7 '+m.code+'</div></div><span class="q '+m.type+'">'+(m.type==='in'?'+':'-')+m.units+'</span></div>';
  }).join('')+'</div>';
}

/* ---- Exportar planilha ---- */
$('#btnExport').onclick=exportXlsx;
function exportXlsx(){
  if(!DB.moves.length&&!Object.keys(DB.products).length){toast('Nada para exportar ainda');return;}
  const wb=XLSX.utils.book_new();
  const mv=[['Data','C\u00f3digo','Descri\u00e7\u00e3o','Tipo','Un/caixa','Quantidade (un)']];
  DB.moves.slice().reverse().forEach(m=>{const d=new Date(m.date);mv.push([d.toLocaleString('pt-BR'),m.code,m.description,m.type==='in'?'Entrou':'Saiu',m.unitsPerBox,(m.type==='in'?1:-1)*m.units]);});
  const ws1=XLSX.utils.aoa_to_sheet(mv);ws1['!cols']=[{wch:18},{wch:16},{wch:30},{wch:10},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws1,'Movimenta\u00e7\u00f5es');
  const st=[['C\u00f3digo','Descri\u00e7\u00e3o','Un/caixa','Entrou','Saiu','Saldo (un)']];
  Object.keys(DB.products).forEach(c=>{const p=DB.products[c];let i=0,o=0;DB.moves.forEach(m=>{if(m.code===c){if(m.type==='in')i+=m.units;else o+=m.units;}});st.push([c,p.description,p.unitsPerBox,i,o,i-o]);});
  const ws2=XLSX.utils.aoa_to_sheet(st);ws2['!cols']=[{wch:16},{wch:30},{wch:10},{wch:10},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'Estoque atual');
  XLSX.writeFile(wb,'estoque_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Planilha gerada');
}

/* ---- Init ---- */
updateHeader();
if(location.protocol!=='https:'&&location.hostname!=='localhost'){$('#scanHint').textContent='Dica: abra por um endere\u00e7o HTTPS para liberar a c\u00e2mera. Voc\u00ea tamb\u00e9m pode digitar o c\u00f3digo abaixo.';}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
